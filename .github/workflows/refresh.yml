name: Refresh podcast feed

# Scheduled rebuild so new podcast episodes appear without a manual push.
# It re-runs the snapshot script, validates/builds the exact refreshed tree,
# then pushes and deploys in ONE workflow, so it never relies on a commit
# triggering deploy.yml (GITHUB_TOKEN pushes don't fire other workflows by design).
#
# Actions are SHA-pinned (this runs with contents:write in a public repo; a
# hijacked version tag must not be able to ship code here). To bump one,
# update the SHA and the trailing version comment together.

on:
  schedule:
    # ~daily at 09:00 UTC. New episodes show within a day of publishing.
    - cron: '0 9 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed snapshot back to the repo
  pages: write # publish the rebuilt site
  id-token: write

# Share the 'pages' group with deploy.yml so a refresh and a push-deploy never
# race each other onto Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    # Only run in the public Pages repo. Other copies skip this job.
    if: ${{ github.repository == 'channie/channie.github.io' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh podcast snapshot from RSS
        id: refresh
        # The script preserves the last-good snapshot on failure, so a feed/CDN
        # outage must NOT fail the cron — keep going and redeploy the current
        # snapshot unchanged.
        continue-on-error: true
        run: node scripts/fetch-podcast.mjs

      - name: Discard incomplete refresh changes
        if: ${{ steps.refresh.outcome == 'failure' }}
        run: |
          git restore --source=HEAD -- src/data/podcast-feed.json src/assets/podcast
          git clean -fd -- src/assets/podcast

      - name: Create local snapshot commit if it changed
        id: refresh_commit
        if: ${{ steps.refresh.outcome == 'success' }}
        run: |
          if [[ -n "$(git status --porcelain src/data/podcast-feed.json src/assets/podcast)" ]]; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/podcast-feed.json src/assets/podcast
            git commit -m 'chore: refresh podcast snapshot from RSS'
            # Replay onto anything pushed since checkout so the push can't race
            # a manual push; validation below runs against this rebased commit.
            git pull --rebase origin "$GITHUB_REF_NAME"
            echo 'committed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            echo 'No podcast changes — redeploying the current snapshot.'
          fi

      # A malformed snapshot fails before any default-branch push. Run the full
      # public CI gate against the exact tree that will be deployed.
      - name: Check content and types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Push validated snapshot commit
        if: ${{ steps.refresh_commit.outputs.committed == 'true' }}
        run: git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
